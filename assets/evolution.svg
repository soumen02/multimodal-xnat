<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>From shared folders to a multimodal platform</title><defs><marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#000000"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#000000"/></marker><marker id="arrD" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d79b00"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="10" y="34" width="205" height="92" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="112.5" y="60.8" font-weight="bold">Shared NFS folders</tspan><tspan x="112.5" y="76.4" font-weight="normal">scanner drops DICOMs</tspan><tspan x="112.5" y="92.0" font-weight="normal">per-lab folders, one</tspan><tspan x="112.5" y="107.6" font-weight="normal">DICOM→NIfTI converter</tspan></text><rect x="235" y="34" width="205" height="92" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="337.5" y="60.8" font-weight="bold">Flywheel</tspan><tspan x="337.5" y="76.4" font-weight="normal">vendor-licensed, local</tspan><tspan x="337.5" y="92.0" font-weight="normal">nice UI and RBAC</tspan><tspan x="337.5" y="107.6" font-weight="normal">no room to customise</tspan></text><rect x="460" y="34" width="205" height="92" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="562.5" y="60.8" font-weight="bold">XNAT (today)</tspan><tspan x="562.5" y="76.4" font-weight="normal">self-hosted, open source</tspan><tspan x="562.5" y="92.0" font-weight="normal">pipelines, HPC, backups</tspan><tspan x="562.5" y="107.6" font-weight="normal">2,500+ sessions · 50+ projects</tspan></text><rect x="685" y="34" width="205" height="92" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="787.5" y="60.8" font-weight="bold">XNAT + MEG</tspan><tspan x="787.5" y="76.4" font-weight="normal">time-series test</tspan><tspan x="787.5" y="92.0" font-weight="normal">MEG sessions in XNAT</tspan><tspan x="787.5" y="107.6" font-weight="normal">verified conversion + QC</tspan></text><path d="M215 80 L235 80" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arr)"/><path d="M440 80 L460 80" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arr)"/><path d="M665 80 L685 80" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arr)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><tspan x="112" y="21.9" font-weight="normal">~4 years ago</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><tspan x="337" y="21.9" font-weight="normal">~1 year, then dropped</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><tspan x="562" y="21.9" font-weight="normal">now</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><tspan x="787" y="21.9" font-weight="normal">Nov 2026</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle"><tspan x="450" y="155.8" font-weight="normal">Each step moves work off researchers and onto the platform</tspan></text></svg>